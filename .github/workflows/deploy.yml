name: deploy

# Deploys production on Laravel Cloud by calling the environment's
# deploy hook. Run it from the Actions tab with "Run workflow". It
# only deploys main, and only once the tests workflow has passed for
# the commit being deployed. The hook URL is a credential, so it lives
# in the LARAVEL_CLOUD_DEPLOY_HOOK_URL repository secret.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Only main can be deployed, not ${GITHUB_REF}."
          exit 1

      - name: Require passing tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          read -r status conclusion < <(
            gh run list \
              --workflow tests.yml \
              --branch main \
              --event push \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"'
          )

          if [ -z "$status" ] || [ "$status" = "null" ]; then
            echo "::error::No tests run found for ${GITHUB_SHA}."
            exit 1
          fi

          if [ "$status" != "completed" ]; then
            echo "::error::Tests for ${GITHUB_SHA} are still ${status}. Try again once they finish."
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::Tests for ${GITHUB_SHA} concluded with ${conclusion}."
            exit 1
          fi

      - name: Trigger Laravel Cloud deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::The LARAVEL_CLOUD_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/json" \
            "$DEPLOY_HOOK_URL"
